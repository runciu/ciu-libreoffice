name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the tag matches the extension version
        run: |
          version=$(sed -n 's/.*<version value="\([^"]*\)".*/\1/p' description.xml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version in description.xml"
            exit 1
          fi

      - name: Unit tests
        run: python -m unittest discover -s tests/unit

      - name: Build
        run: python scripts/build_oxt.py

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/ciu-libreoffice.oxt \
            --title "CIU for LibreOffice $GITHUB_REF_NAME" --generate-notes
